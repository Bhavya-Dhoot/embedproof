window.SCRIPT = [{"id": "1.1", "ch": 1, "t": 0.9, "end": 6.284, "cap": "Every tonne of Turkish steel entering the EU now carries a carbon bill."}, {"id": "1.2", "ch": 1, "t": 6.624, "end": 12.961, "cap": "Since 1 January 2026, importers pay for the emissions embedded in what they bring in."}, {"id": "1.3", "ch": 1, "t": 13.301, "end": 16.465, "cap": "But nobody can see the CO₂ in a steel coil."}, {"id": "1.4", "ch": 1, "t": 16.805, "end": 21.968, "cap": "So an importer can trust a number it cannot check, or pay a default value plus a mark-up."}, {"id": "1.5", "ch": 1, "t": 22.308, "end": 27.061, "cap": "10% in 2026. 20% in 2027. 30% from 2028."}, {"id": "1.6", "ch": 1, "t": 27.401, "end": 29.934, "cap": "That punishes exactly the mills that cleaned up."}, {"id": "2.1", "ch": 2, "t": 30.884, "end": 35.301, "cap": "EmbedProof makes the claim checkable, and the tonne impossible to sell twice."}, {"id": "2.2", "ch": 2, "t": 35.641, "end": 39.607, "cap": "First, an AI model asks whether the number is plausible for this plant."}, {"id": "2.3", "ch": 2, "t": 39.947, "end": 47.97, "cap": "Then it is signed twice: one classical signature, one post-quantum signature, because these records are kept for years."}, {"id": "2.4", "ch": 2, "t": 48.31, "end": 53.315, "cap": "A smart contract anchors the result, and refuses to hand the same tonne to two buyers."}, {"id": "2.5", "ch": 2, "t": 53.655, "end": 57.044, "cap": "Anything the model flags goes to a human verifier first."}, {"id": "3.1", "ch": 3, "t": 57.994, "end": 67.474, "cap": "Marmara Demir, a fictional scrap-fed mill, reports 0.535 tCO₂ per tonne of steel for September."}, {"id": "3.2", "ch": 3, "t": 67.814, "end": 73.604, "cap": "The model checks it against what this route, size and grid can emit, and the plant's own history."}, {"id": "3.3", "ch": 3, "t": 73.944, "end": 77.475, "cap": "Inside the expected range: risk 20, green."}, {"id": "3.4", "ch": 3, "t": 78.065, "end": 85.804, "cap": "The mill signs. The attestor adds two signatures and anchors the batch on chain: about 228,000 gas."}, {"id": "4.1", "ch": 4, "t": 86.754, "end": 95.347, "cap": "Anadolu Entegre, a fictional blast-furnace mill, reports 0.56: a figure only an electric-arc mill could reach."}, {"id": "4.2", "ch": 4, "t": 95.687, "end": 102.386, "cap": "The model expected about 2.3. Its reasons are listed: the production route, and the plant's own history."}, {"id": "4.3", "ch": 4, "t": 102.726, "end": 108.495, "cap": "Risk 100. Red. The batch is held for a verifier, and its tonnes cannot be allocated."}, {"id": "4.4", "ch": 4, "t": 109.035, "end": 115.831, "cap": "The verifier unseals the report, reads those reasons, and overrides it, with a written reason pinned to the batch."}, {"id": "5.1", "ch": 5, "t": 116.781, "end": 123.187, "cap": "Back to the honest batch: 5,000 verified tonnes, all allocated to Importer A."}, {"id": "5.2", "ch": 5, "t": 123.527, "end": 126.477, "cap": "Now the same 5,000 tonnes, to Importer B."}, {"id": "5.3", "ch": 5, "t": 127.667, "end": 132.981, "cap": "The contract reverts. Double claim blocked: 5,000 requested, 0 remaining."}, {"id": "5.4", "ch": 5, "t": 133.321, "end": 138.799, "cap": "Double claiming is treated like double spending: the cap is enforced on chain."}, {"id": "6.1", "ch": 6, "t": 139.749, "end": 146.316, "cap": "Importer A scans the certificate's QR code. No wallet, no login: every check runs in the browser."}, {"id": "6.2", "ch": 6, "t": 146.656, "end": 149.882, "cap": "Both signatures verify, including the post-quantum one."}, {"id": "6.3", "ch": 6, "t": 150.222, "end": 155.057, "cap": "Now change one digit: 0.535 becomes 0.534."}, {"id": "6.4", "ch": 6, "t": 155.897, "end": 160.11, "cap": "The fingerprint no longer matches the chain, and neither signature validates."}, {"id": "7.1", "ch": 7, "t": 161.06, "end": 171.263, "cap": "Why now: CBAM's definitive phase has begun, Türkiye's emissions trading pilot covers the same sectors, and the EU is its largest trading partner."}, {"id": "7.2", "ch": 7, "t": 171.603, "end": 177.285, "cap": "Without verified data, a cleaner mill pays the same default plus mark-up as everyone else."}, {"id": "7.3", "ch": 7, "t": 177.625, "end": 187.002, "cap": "For one shipment: tonnes × (default + mark-up − verified actual) × EU carbon price. Illustrative, demo data."}, {"id": "7.4", "ch": 7, "t": 187.342, "end": 192.108, "cap": "EmbedProof makes the real figure cheap to trust, and impossible to count twice."}, {"id": "7.5", "ch": 7, "t": 192.448, "end": 199.526, "cap": "And with COP31 opening in Antalya on 9 November, this is implementation, not another pledge."}, {"id": "8.1", "ch": 8, "t": 200.476, "end": 207.9, "cap": "Not accredited CBAM verification. No offsets. No Article 6."}, {"id": "8.2", "ch": 8, "t": 208.24, "end": 212.654, "cap": "The chain guarantees integrity after data entry, not the truth of the data."}, {"id": "8.3", "ch": 8, "t": 212.994, "end": 217.212, "cap": "The model measures consistency with Climate TRACE, not real emissions."}, {"id": "8.4", "ch": 8, "t": 217.552, "end": 226.83, "cap": "With plant history it catches 97% of half-size under-reports. With no history, 84%: that misses our 90% target."}, {"id": "8.5", "ch": 8, "t": 227.17, "end": 236.581, "cap": "178 contract tests, 100% coverage. Next: a 2-of-3 attestor quorum, zero-knowledge range proofs, a permissioned Besu network."}, {"id": "8.6", "ch": 8, "t": 236.921, "end": 239.933, "cap": "EmbedProof. Check the claim. Block the double sale."}];

const wipeP = (() => { const el = document.createElement('div'); el.className = 'glass'; el.id = 'wipe'; el.innerHTML = '<div class="scrim"></div><div class="body"></div>'; root.appendChild(el); el.querySelector('.scrim').style.opacity = .5; return el; })();
const pipsEl = $('#pips'); CHAPTERS.forEach(() => pipsEl.appendChild(document.createElement('i')));
const kickEl = $('#kick'), capEl = $('#cap');
let kickN = -1, capK = -2;
const subst = s => s.replace(/₂/g, '<span class="sub2">2</span>').replace(/&/g, '&amp;');

function render(t) {
  if (!window.READY) return;
  FIELDS.forEach((d, i) => { d.style.transform = `translate(${960 + 480 * Math.sin(t * .35 + i * 2.1) - 650}px,${540 + 320 * Math.cos(t * .28 + i * 1.3) - 650}px)`; });
  ORBS.forEach((d, i) => { d.style.transform = `translate(${160 + rnd(i + 10) * 1600 + Math.sin(t * (.25 + rnd(i + 30) * .3) + i * 2) * 170}px,${120 + rnd(i + 20) * 800 + Math.cos(t * (.22 + rnd(i + 40) * .25) + i) * 130}px)`; });

  // chapter kicker and pips
  const ci = CHAPTERS.findIndex(c => t >= c.start && t < c.t1), ch = CHAPTERS[ci >= 0 ? ci : CHAPTERS.length - 1], cs = ch.start + (ch.n === 1 ? 0.3 : .35);
  if (ch.n !== kickN) { kickN = ch.n; kickEl.innerHTML = `<b>0${ch.n}</b>${ch.name}`; [...pipsEl.children].forEach((p, i) => { p.style.background = i + 1 === ch.n ? 'var(--teal-t)' : i + 1 < ch.n ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.22)'; p.style.width = i + 1 === ch.n ? '58px' : '34px'; }); }
  kickEl.style.opacity = eo(seg(t, cs, cs + .5)) * (1 - eo(seg(t, cs + 3.2, cs + 3.8)));   // the chapter name shows for its first seconds only
  pipsEl.style.opacity = ch.n === CHAPTERS.length ? 1 - eo(seg(t, T('8.6', -.2), T('8.6', .3))) : 1;

  for (const p of PAN) placePanel(p, t);
  for (const v of VIS) { if (updateVis(v, t) && v.fn) v.fn(t, v.el); }
  for (const a of ANIM) a.fn(clamp(t, a.a, a.b));   // out of its window an animation holds its edge state, so render(t) stays a pure function of t

  // frosted dip between chapters
  let w = 0; for (const c of CHAPTERS) { if (c.n === 1) continue; w = Math.max(w, eo(seg(t, c.start - .5, c.start - .08)) * (1 - eo(seg(t, c.start + .02, c.start + .55)))); }
  frost(wipeP, w, 24); wipeP.style.zIndex = 40; wipeP.style.transform = 'none';

  // burned-in caption, one line of the script at a time
  let k = -1; for (let i = 0; i < SCRIPT.length; i++) if (t >= SCRIPT[i].t - .06 && t <= SCRIPT[i].end + .22) k = i;
  if (k !== capK) { capK = k; if (k >= 0) capEl.innerHTML = subst(SCRIPT[k].cap); }
  if (k >= 0) { const s = SCRIPT[k]; capEl.style.opacity = eo(seg(t, s.t - .06, s.t + .12)) * (1 - eo(seg(t, s.end + .02, s.end + .22))); } else capEl.style.opacity = 0;

  renderCursor(t);
  const cm = camAt(t); $('#world').style.transform = `translate(${960 - cm.fx * cm.s}px,${480 - cm.fy * cm.s}px) scale(${cm.s})`;
}
