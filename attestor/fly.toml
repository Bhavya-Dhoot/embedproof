# Deploy from the REPOSITORY ROOT:  fly deploy --config attestor/fly.toml
#   fly secrets set ATTESTOR_PRIVATE_KEY=0x... PINATA_JWT=... --config attestor/fly.toml
#   fly volumes create attestor_data --size 1 --region fra --config attestor/fly.toml
# One machine only: sqlite, the ML-DSA key and the local IPFS store live on the attached volume.
app = "embedproof-attestor"
primary_region = "fra"

[build]
  dockerfile = "attestor/Dockerfile"
  [build.args]
    WITH_LIBOQS = "0"

[env]
  CHAIN_ID = "84532"
  RPC_URL = "https://sepolia.base.org"
  DEPLOYMENTS = "/app/deployments"
  DATA_DIR = "/data"
  CORS_ORIGINS = "https://embedproof.vercel.app,http://localhost:3000"
  CLIENT_IP_HEADER = "fly-client-ip"

[[mounts]]
  source = "attestor_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
